# Keycloak (SSO) for https://rep.local.inion/auth/
# Requires external network: services-network. Secrets come from .env (gen-env.sh).

services:
  keycloak-postgres:
    image: docker.io/postgres:16.15-alpine
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - services-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: keycloak
    # Production mode; the realm file is imported only if the realm does not exist yet
    command: ["start", "--import-realm"]
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: https://${DOMAIN:-rep.local.inion}/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      TZ: Europe/Moscow
    volumes:
      - ./realm-inion.json:/opt/keycloak/data/import/realm-inion.json:ro
      - ./themes/rep:/opt/keycloak/themes/rep:ro
      # Optional Kerberos keytab (KERBEROS_ENABLED=true), see docs/SSO.md
      - ./kerberos:/etc/keycloak-kerberos:ro
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      # The image has no curl: talk HTTP to the management port with bash
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -1 <&3 | grep -q ' 200 '
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    restart: unless-stopped
    networks:
      - services-network

volumes:
  keycloak-db:

networks:
  services-network:
    external: true
