# Trusted identity headers for backends. Values come ONLY from oauth2-proxy;
# proxy_set_header replaces whatever the client sent under the same names.
proxy_set_header X-Remote-User   $sso_user;
proxy_set_header X-Remote-Email  $sso_email;
proxy_set_header X-Remote-Groups $sso_groups;
# Access token: backends read the full name from it (oauth2-proxy has no name header)
proxy_set_header X-Remote-Token  $sso_token;
proxy_set_header X-Remote-Name   "";
