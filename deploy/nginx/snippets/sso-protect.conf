# Pages behind SSO: check the session in oauth2-proxy, send to login if there is none.
auth_request /oauth2/auth;
# No session -> /oauth2/start (original URL comes via X-Auth-Request-Redirect)
error_page 401 = /oauth2/start?sso=1;
error_page 403 /sso-403.html;
auth_request_set $sso_user   $upstream_http_x_auth_request_preferred_username;
auth_request_set $sso_email  $upstream_http_x_auth_request_email;
auth_request_set $sso_groups $upstream_http_x_auth_request_groups;
auth_request_set $sso_token  $upstream_http_x_auth_request_access_token;
auth_request_set $sso_cookie $upstream_http_set_cookie;
# Refreshed session cookie from oauth2-proxy
add_header Set-Cookie $sso_cookie;
include /etc/nginx/rep/security-headers.conf;
