# Locations WITHOUT SSO: never let a client pass identity headers to a backend.
# An empty value makes nginx drop the header instead of forwarding the client's one.
proxy_set_header X-Remote-User   "";
proxy_set_header X-Remote-Email  "";
proxy_set_header X-Remote-Name   "";
proxy_set_header X-Remote-Groups "";
proxy_set_header X-Remote-Token  "";
