# /etc/nginx/conf.d/rep.local.inion.conf
# Unified portal: Portal + NetBox + MediaWiki

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name rep.local.inion;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rep.local.inion;

    ssl_certificate     /etc/nginx/ssl/rep.local.inion.crt;
    ssl_certificate_key /etc/nginx/ssl/rep.local.inion.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!RC4:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/rep.local.inion.access.log;
    error_log  /var/log/nginx/rep.local.inion.error.log;

    client_max_body_size 100M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;

    # Health (host nginx)
    location = /health {
        default_type text/plain;
        return 200 "OK\n";
    }

    # Portal API + SPA (FastAPI serves both)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # NetBox — KEEP /netbox/ prefix (BASE_PATH=netbox/)
    # Do NOT put a trailing slash on proxy_pass that would strip the path.
    location /netbox/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /netbox;
        proxy_redirect off;
        proxy_buffering off;
    }

    location = /netbox {
        return 301 /netbox/;
    }

    # MediaWiki — STRIP /wiki prefix (container serves at /)
    # Browser: /wiki/index.php → upstream: /index.php
    location /wiki/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    location = /wiki {
        return 301 /wiki/;
    }
}
