# /etc/nginx/conf.d/rep.local.inion.conf
# Unified portal with SSO: Portal + NetBox + MediaWiki behind Keycloak / oauth2-proxy.
# Snippets live in /etc/nginx/rep/ (deploy/nginx/snippets in the repo).
#
#   /auth/                 Keycloak                         (no auth_request)
#   /oauth2/               oauth2-proxy                     (no auth_request)
#   /health, /api/health   health checks                    (no auth_request)
#   /netbox/api/           NetBox API, token auth           (no auth_request, X-Remote-* wiped)
#   /netbox/static/        NetBox static files              (no auth_request)
#   everything else        auth_request /oauth2/auth + X-Remote-* from oauth2-proxy

# HTTP -> HTTPS on the canonical name
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /health {
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        return 301 https://rep.local.inion$request_uri;
    }
}

# HTTPS by IP or any other name -> canonical name.
# SSO cookies, Keycloak hostname and redirect URIs are bound to rep.local.inion.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/rep.local.inion.crt;
    ssl_certificate_key /etc/nginx/ssl/rep.local.inion.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /health {
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        return 301 https://rep.local.inion$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rep.local.inion;

    ssl_certificate     /etc/nginx/ssl/rep.local.inion.crt;
    ssl_certificate_key /etc/nginx/ssl/rep.local.inion.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!RC4:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    include /etc/nginx/rep/security-headers.conf;

    access_log /var/log/nginx/rep.local.inion.access.log;
    error_log  /var/log/nginx/rep.local.inion.error.log;

    client_max_body_size 100M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;

    # Keycloak and oauth2-proxy send big headers (tokens, cookies with groups):
    # without this -> 502 "upstream sent too big header"
    large_client_header_buffers 4 32k;
    proxy_buffer_size 128k;
    proxy_buffers 8 128k;
    proxy_busy_buffers_size 256k;

    # --- Health (no SSO) ---
    location = /health {
        default_type text/plain;
        return 200 "OK\n";
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/rep/proxy-common.conf;
        include /etc/nginx/rep/sso-strip.conf;
    }

    # --- SSO infrastructure ---
    location /auth/ {
        include /etc/nginx/rep/keycloak-proxy.conf;
    }

    # Admin console and the master realm: only from allowed networks
    location ^~ /auth/admin/ {
        include /etc/nginx/rep/keycloak-admin-allow.conf;
        include /etc/nginx/rep/keycloak-proxy.conf;
    }

    location ^~ /auth/realms/master/ {
        include /etc/nginx/rep/keycloak-admin-allow.conf;
        include /etc/nginx/rep/keycloak-proxy.conf;
    }

    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        include /etc/nginx/rep/proxy-common.conf;
        include /etc/nginx/rep/sso-strip.conf;
        # Where to return after login (used by /oauth2/start)
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    location = /oauth2/auth {
        internal;
        proxy_pass http://127.0.0.1:4180;
        include /etc/nginx/rep/proxy-common.conf;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    location = /sso-403.html {
        internal;
        root /usr/share/nginx/rep;
        try_files /403.html =403;
    }

    location @sso_api_401 {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 401 '{"detail":"Требуется вход","login":"/oauth2/start"}';
    }

    location @sso_api_403 {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 403 '{"detail":"Нет доступа: учётная запись не входит в группы портала"}';
    }

    # --- Portal (FastAPI + SPA) ---
    location /api/ {
        include /etc/nginx/rep/sso-protect-api.conf;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/rep/proxy-common.conf;
        include /etc/nginx/rep/sso-headers.conf;
    }

    location / {
        include /etc/nginx/rep/sso-protect.conf;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/rep/proxy-common.conf;
        include /etc/nginx/rep/sso-headers.conf;
    }

    # --- NetBox (KEEP /netbox/ prefix, BASE_PATH=netbox/) ---
    # Static files: the container's nginx-unit serves them only at /static/
    location ^~ /netbox/static/ {
        proxy_pass http://127.0.0.1:8000/static/;
        include /etc/nginx/rep/proxy-common.conf;
        include /etc/nginx/rep/sso-strip.conf;
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/rep/security-headers.conf;
    }

    # REST API with tokens (Authorization: Token ...), no SSO; identity headers wiped
    location ^~ /netbox/api/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/rep/proxy-common.conf;
        include /etc/nginx/rep/sso-strip.conf;
        proxy_set_header X-Forwarded-Prefix /netbox;
        proxy_redirect off;
        proxy_buffering off;
    }

    # Logout in NetBox = single logout everywhere
    location = /netbox/logout/ {
        return 302 /oauth2/sign_out?rd=%2F;
    }

    location = /netbox {
        return 301 /netbox/;
    }

    location /netbox/ {
        include /etc/nginx/rep/sso-protect.conf;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/rep/proxy-common.conf;
        include /etc/nginx/rep/sso-headers.conf;
        proxy_set_header X-Forwarded-Prefix /netbox;
        proxy_redirect off;
        proxy_buffering off;
    }

    # --- MediaWiki (STRIP /wiki prefix, container serves at /) ---
    location = /wiki {
        return 301 /wiki/;
    }

    location /wiki/ {
        include /etc/nginx/rep/sso-protect.conf;
        proxy_pass http://127.0.0.1:8080/;
        include /etc/nginx/rep/proxy-common.conf;
        include /etc/nginx/rep/sso-headers.conf;
        proxy_redirect off;
    }
}
