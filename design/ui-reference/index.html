<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Единая точка входа в корпоративные системы" />
    <title>Портал сервисов</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Тема применяется до отрисовки, чтобы не было вспышки светлого фона
      try {
        var p = JSON.parse(localStorage.getItem('portal.prefs.v1') || '{}');
        var t = p.theme || 'dark';
        if (t === 'system') document.documentElement.removeAttribute('data-theme');
        else document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <script src="/config.js"></script>
    <!-- styles -->
  </head>
  <body>
    <noscript>Для работы портала включите JavaScript.</noscript>
    <div id="root"></div>
    <!-- scripts -->
  </body>
</html>
