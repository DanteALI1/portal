# /opt/services/portal/nginx.conf — Nginx внутри контейнера портала
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Настройки портала меняются без пересборки — не кешируем
    location = /config.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html всегда свежий, чтобы после обновления подхватывались новые сборки
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Файлы сборки с хешем в имени — кешируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(png|jpg|gif|ico|svg|woff2)$ {
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
